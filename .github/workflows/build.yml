name: Build AMS Kurir (Signed APK & AAB)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Official Signed APK & AAB
      run: |
        ./gradlew assembleRegularRelease bundleRegularRelease --stacktrace

    - name: Upload Official Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: AMS-Kurir-Signed-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Upload Official Signed AAB (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: AMS-Kurir-Signed-AAB
        path: app/build/outputs/bundle/regularRelease/*.aab
