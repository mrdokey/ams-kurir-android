name: Build AMS Kurir (APK & AAB)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Regular Debug APK & Release AAB
      run: |
        ./gradlew assembleRegularDebug bundleRegularRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMS-Kurir-APK
        path: app/build/outputs/apk/regular/debug/*.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMS-Kurir-AAB
        path: app/build/outputs/bundle/regularRelease/*.aab
